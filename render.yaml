services:
  - type: web
    name: jmd-gems-jewellery
    env: node
    plan: free
    installCommand: npm install --include=dev --no-audit --no-fund
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NEXTAUTH_URL
        value: https://jmd-gems-jewellery.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        # Create a random string, e.g. run: openssl rand -hex 16
      - key: METAL_API_URL
        value: https://metals-api.com/api/latest
      - key: METAL_API_KEY
        # Optional. Leave blank to use manual rates from /admin/rates
      - key: DATABASE_URL
        # Optional. Leave blank to stay in Demo mode (JSON store)
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
